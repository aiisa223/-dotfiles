[colors]
transparent = #00000000

background = #070809
island = #070809
island-alt = #070809
background-alt = #0B0D10

foreground = #A5AAB1
foreground-bright = #F1F3F5
dim = #676D76

purple = #46527C
purple-hi = #8297FF
alert = #E46C78


[bar/main]
monitor = eDP-1

bottom = true
width = 100%
height = 30pt
fixed-center = true

; The bar itself disappears into the desktop.
; Only the module groups are visible.
background = ${colors.background}
foreground = ${colors.foreground}

; Transparent breathing room above/below the islands.
border-size = 0pt
border-color = ${colors.transparent}

padding-left = 1
padding-right = 1
module-margin = 0

font-0 = "IBM Plex Sans:style=Medium:size=10;3"

modules-left = i3
modules-center = 
modules-right = cpu memory temperature pulseaudio battery profile date tray

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
wm-restack = i3


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; WORKSPACE ISLAND
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
line-size = 2pt
font-1 = "IBM Plex Sans:style=Medium:size=10;3"
font-2 = "Terminus (TTF):style=Medium:size=13;2"
font-3 = "Font Awesome 6 Free:style=Solid:size=15;3"
font-4 = "Font Awesome 6 Free:style=Solid:size=19;4"
[module/i3]
type = internal/i3
strip-wsnumbers = true

pin-workspaces = true
show-urgent = true
index-sort = true

enable-click = true
enable-scroll = false

format = <label-state> <label-mode>
format-background = ${colors.background}
format-padding = 1

label-focused = %name%
label-focused-foreground = ${colors.foreground-bright}
label-focused-background = ${colors.background}
label-focused-padding = 1

label-unfocused = %name%
label-unfocused-foreground = ${colors.dim}
label-unfocused-background = ${colors.background}
label-unfocused-padding = 1

label-visible = %name%
label-visible-foreground = ${colors.foreground}
label-visible-background = ${colors.background}
label-visible-padding = 1

label-urgent = %name%
label-urgent-foreground = ${colors.foreground-bright}
label-urgent-background = ${colors.background}
label-urgent-padding = 1

label-mode = %mode%
label-mode-foreground = ${colors.foreground-bright}
label-mode-background = ${colors.background-alt}
label-mode-padding = 1


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; ACTIVE WINDOW ISLAND
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
label-focused-font = 2
label-unfocused-font = 2
label-visible-font = 2
label-urgent-font = 2
label-mode-font = 2
label-focused-underline = ${colors.purple-hi}
label-urgent-underline = ${colors.alert}
[module/title]
type = internal/xwindow

format = <label>
format-background = ${colors.island-alt}
format-padding = 2

label = %title%
label-maxlen = 38

label-empty = desktop
label-empty-foreground = ${colors.dim}


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; SYSTEM ISLAND
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
format-underline = ${colors.purple}
[module/cpu]
type = internal/cpu

interval = 2
warn-percentage = 90

format = <label>
format-background = ${colors.background}
format-padding = 1

label = %{F#676D76}CPU%{F-} %percentage%%
label-warn = %{F#E46C78}CPU%{F-} %percentage%%
format-underline = ${colors.background}
[module/memory]
type = internal/memory

interval = 2
warn-percentage = 90

format = <label>
format-background = ${colors.background}
format-padding = 1

label = %{F#676D76}RAM%{F-} %gb_used%
label-warn = %{F#E46C78}RAM%{F-} %gb_used%
format-underline = ${colors.background}
[module/temperature]
type = internal/temperature

interval = 5
zone-type = x86_pkg_temp
warn-temperature = 95

format = <label>
format-background = ${colors.background}
format-padding = 1

label = %{F#676D76}TEMP%{F-} %temperature-c%
label-warn = %{F#E46C78}TEMP%{F-} %temperature-c%
format-underline = ${colors.background}
[module/pulseaudio]
type = internal/pulseaudio

use-ui-max = false
interval = 5

format-volume = <label-volume>
format-volume-background = ${colors.background}
format-volume-padding = 1

format-muted = <label-muted>
format-muted-background = ${colors.background}
format-muted-padding = 1

label-volume = %{F#676D76}VOL%{F-} %percentage%%
label-muted = %{F#E46C78}VOL%{F-} mute

click-left = #pulseaudio.toggle
click-right = pavucontrol
scroll-up = #pulseaudio.inc
scroll-down = #pulseaudio.dec
format-volume-underline = ${colors.background}
format-muted-underline = ${colors.background}
[module/battery]
type = internal/battery

battery = BAT0
adapter = AC

full-at = 100
low-at = 15
poll-interval = 5

format-charging = <label-charging>
format-charging-background = ${colors.background}
format-charging-padding = 1

format-discharging = <label-discharging>
format-discharging-background = ${colors.background}
format-discharging-padding = 1

format-full = <label-full>
format-full-background = ${colors.background}
format-full-padding = 1

format-low = <label-low>
format-low-background = ${colors.background}
format-low-padding = 1

label-charging = %{F#676D76}BAT%{F-} +%percentage%%
label-discharging = %{F#676D76}BAT%{F-} %percentage%%
label-full = %{F#676D76}BAT%{F-} %percentage%%
label-low = %{F#E46C78}BAT%{F-} %percentage%%
format-charging-underline = ${colors.background}
format-discharging-underline = ${colors.background}
format-full-underline = ${colors.background}
format-low-underline = ${colors.background}
[module/profile]
type = custom/script

exec = /home/ali/.local/bin/platform-profile-status
interval = 5

format = <label>
format-background = ${colors.background}
format-padding = 1

label = %{F#A5AAB1}%output%%{F-}

click-left = /home/ali/.local/bin/platform-profile-menu &


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; TRANSPARENT SEPARATORS BETWEEN ISLANDS
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
format-underline = ${colors.background}
[module/gap-1]
type = custom/text

label = "  "
label-background = ${colors.transparent}


[module/gap-2]
type = custom/text

label = "  "
label-background = ${colors.transparent}


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; CLOCK ISLAND
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/date]
type = internal/date

interval = 5

format = <label>
format-background = ${colors.background}
format-padding = 1

date = %H:%M
label = %date%


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; TRAY ISLAND
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
format-underline = ${colors.purple}
[module/tray]
type = internal/tray

format = <tray>
format-background = ${colors.background}
format-padding = 1

; Compact taskbar tray.
tray-size = 74%
tray-padding = 2px
tray-spacing = 6px

tray-background = ${colors.background}

; BEGIN BCN TASKBAR APPS
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; START BUTTON
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/start]
type = custom/text

format = <label>
format-background = ${colors.island-alt}

label = 
label-foreground = ${colors.purple-hi}
label-background = ${colors.island-alt}
label-padding = 1

click-left = /home/ali/.local/bin/app-launcher
click-right = rofi -show window


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; PINNED / RUNNING APPLICATION TASK AREA
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
label-font = 5
[module/tasks]
type = custom/script

exec = /home/ali/.local/bin/taskbar-tasks
interval = 1

format = <label>
format-background = ${colors.island-alt}
format-padding = 1

label = %output%

; END BCN TASKBAR APPS
label-font = 4
[settings]
screenchange-reload = true
pseudo-transparency = true
