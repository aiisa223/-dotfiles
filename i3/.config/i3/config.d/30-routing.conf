# Indicant engineering application routing.
#
# Only applications with a stable, unambiguous engineering role are assigned.
# Browser, ordinary terminals, Dolphin, and normal ChatGPT windows remain
# user-placed.

# PyCharm -> primary implementation workspace.
assign [class="^jetbrains-pycharm$"] $ws1

# Codex desktop -> agent workspace.
#
# Codex currently exposes the generic ChatGPT Electron class, so both class
# and its Codex-specific X11 instance are required to avoid routing ordinary
# ChatGPT windows.
assign [class="^Chatgpt$" instance=".*Codex.*"] $ws2
