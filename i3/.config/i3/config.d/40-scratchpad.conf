# Scratchpads.
#
# Preserve the generic i3 scratchpad.
bindsym $mod+minus scratchpad show
bindsym $mod+Shift+minus move scratchpad

# Dedicated Indicant engineering terminal.
#
# Kitty explicitly sets both parts of WM_CLASS so this rule does not depend
# on titles, shell state, working directory, or heuristic matching.
for_window [class="^IndicantScratch$" instance="^indicant-scratch$"] floating enable, resize set 1200 760, move scratchpad

# Toggle the dedicated terminal from any workspace.
bindsym $mod+grave [class="^IndicantScratch$" instance="^indicant-scratch$"] scratchpad show

# Recovery binding if the persistent scratchpad terminal was explicitly closed.
bindsym $mod+Shift+grave exec --no-startup-id kitty --class IndicantScratch --name indicant-scratch --directory /home/ali/Data/work/projects/velos_monitor

# Start one persistent scratchpad terminal on initial i3 login.
exec --no-startup-id kitty --class IndicantScratch --name indicant-scratch --directory /home/ali/Data/work/projects/velos_monitor
